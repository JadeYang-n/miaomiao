spring:
  application:
    name: miaomiao

  # H2 database
  datasource:
    url: jdbc:h2:file:./data/antifraud;AUTO_RECONNECT=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# LLM configuration
llm:
  api-key: ${LLM_API_KEY:your-llm-api-key}
  base-url: ${LLM_BASE_URL:https://api.example.com/v1}
  model: ${LLM_MODEL:your-model-name}
  temperature: 0.7
  max-tokens: 1024

# TTS configuration
tts:
  api-key: ${TTS_API_KEY:your-tts-api-key}
  base-url: ${TTS_BASE_URL:https://api.example.com/v1/chat/completions}
  model: ${TTS_MODEL:your-tts-model}

# Feishu configuration
feishu:
  app-id: ${FEISHU_APP_ID:your-feishu-app-id}
  app-secret: ${FEISHU_APP_SECRET:your-feishu-app-secret}
  bot-name: 苗苗
  user-open-id: ${FEISHU_USER_OPEN_ID:your-feishu-user-open-id}

# Alert notification
notification:
  enabled: true
  feishu:
    app-id: ${FEISHU_APP_ID:your-feishu-app-id}
    app-secret: ${FEISHU_APP_SECRET:your-feishu-app-secret}
    user-open-id: ${FEISHU_USER_OPEN_ID:your-feishu-user-open-id}
  dingtalk:
    webhook-url: ${DINGTALK_WEBHOOK_URL:}
